<svg width="100%" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img" style="max-width: 680px; display: block; margin-inline: auto; background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <title>Personalized News Summarizer — System Workflow Architecture</title>
  <desc>Full system architecture showing ingestion, clustering, vector storage, personalization, and RAG retrieval layers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </marker>
    <style>
      .layer-title { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: 0.08em; }
      .node-box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2px; }
      .node-box-teal { fill: #f0fdfa; stroke: #5eead4; stroke-width: 1.2px; }
      .node-box-purple { fill: #faf5ff; stroke: #d8b4fe; stroke-width: 1.2px; }
      .node-box-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.2px; }
      .node-box-coral { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.2px; }
      .node-box-green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.2px; }
      .node-box-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.2px; }
      .th { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .ts { font-size: 11px; font-weight: 400; fill: #64748b; }
      .arr { stroke: #64748b; stroke-width: 1.2px; fill: none; }
      .arr-dashed { stroke: #64748b; stroke-width: 1.2px; stroke-dasharray: 4 3; fill: none; }
    </style>
  </defs>

  <!-- LAYER LABELS -->
  <text class="layer-title" x="24" y="78">INGESTION</text>
  <text class="layer-title" x="24" y="228">PROCESSING</text>
  <text class="layer-title" x="24" y="408">STORAGE</text>
  <text class="layer-title" x="24" y="528">PERSONALIZATION</text>
  <text class="layer-title" x="24" y="668">RETRIEVAL</text>

  <!-- ===== INGESTION LAYER ===== -->
  <g transform="translate(130, 48)">
    <rect class="node-box-teal" x="0" y="0" width="130" height="52" rx="8"></rect>
    <text class="th" x="65" y="20" text-anchor="middle" dominant-baseline="central">News APIs</text>
    <text class="ts" x="65" y="38" text-anchor="middle" dominant-baseline="central">GNews REST API</text>
  </g>
  <g transform="translate(290, 48)">
    <rect class="node-box-teal" x="0" y="0" width="130" height="52" rx="8"></rect>
    <text class="th" x="65" y="20" text-anchor="middle" dominant-baseline="central">Web Scrapers</text>
    <text class="ts" x="65" y="38" text-anchor="middle" dominant-baseline="central">HN, TechReview</text>
  </g>
  <g transform="translate(450, 48)">
    <rect class="node-box-teal" x="0" y="0" width="130" height="52" rx="8"></rect>
    <text class="th" x="65" y="20" text-anchor="middle" dominant-baseline="central">RSS Feeds</text>
    <text class="ts" x="65" y="38" text-anchor="middle" dominant-baseline="central">The Hindu, BBC, etc.</text>
  </g>

  <!-- Arrows: Ingestion -> Deduplication -->
  <line x1="195" y1="100" x2="195" y2="120" class="arr"></line>
  <line x1="355" y1="100" x2="355" y2="120" class="arr"></line>
  <line x1="515" y1="100" x2="515" y2="120" class="arr"></line>
  <line x1="195" y1="120" x2="515" y2="120" class="arr"></line>
  <line x1="355" y1="120" x2="355" y2="140" class="arr" marker-end="url(#arrow)"></line>

  <!-- ===== PROCESSING LAYER ===== -->
  <g transform="translate(280, 140)">
    <rect class="node-box" x="0" y="0" width="150" height="44" rx="8"></rect>
    <text class="th" x="75" y="22" text-anchor="middle" dominant-baseline="central">Deduplication</text>
  </g>
  <line x1="355" y1="184" x2="355" y2="200" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(230, 200)">
    <rect class="node-box-purple" x="0" y="0" width="250" height="52" rx="8"></rect>
    <text class="th" x="125" y="20" text-anchor="middle" dominant-baseline="central">Semantic Clustering</text>
    <text class="ts" x="125" y="38" text-anchor="middle" dominant-baseline="central">HDBSCAN + UMAP Dimensionality</text>
  </g>
  <line x1="355" y1="252" x2="355" y2="268" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(230, 268)">
    <rect class="node-box-purple" x="0" y="0" width="250" height="52" rx="8"></rect>
    <text class="th" x="125" y="20" text-anchor="middle" dominant-baseline="central">Cluster Summarization</text>
    <text class="ts" x="125" y="38" text-anchor="middle" dominant-baseline="central">Ollama + Phi-3 Mini (3-4 Sentences)</text>
  </g>
  <line x1="355" y1="320" x2="355" y2="336" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(230, 336)">
    <rect class="node-box" x="0" y="0" width="250" height="44" rx="8"></rect>
    <text class="th" x="125" y="16" text-anchor="middle" dominant-baseline="central">Embed Summaries</text>
    <text class="ts" x="125" y="32" text-anchor="middle" dominant-baseline="central">sentence-transformers (all-MiniLM-L6-v2)</text>
  </g>

  <!-- ===== STORAGE LAYER ===== -->
  <line x1="355" y1="380" x2="355" y2="400" class="arr"></line>
  <line x1="200" y1="400" x2="510" y2="400" class="arr"></line>
  <line x1="200" y1="400" x2="200" y2="416" class="arr" marker-end="url(#arrow)"></line>
  <line x1="510" y1="400" x2="510" y2="416" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(120, 416)">
    <rect class="node-box-blue" x="0" y="0" width="160" height="52" rx="8"></rect>
    <text class="th" x="80" y="20" text-anchor="middle" dominant-baseline="central">Vector DB</text>
    <text class="ts" x="80" y="38" text-anchor="middle" dominant-baseline="central">ChromaDB Store</text>
  </g>

  <g transform="translate(430, 416)">
    <rect class="node-box-blue" x="0" y="0" width="160" height="52" rx="8"></rect>
    <text class="th" x="80" y="20" text-anchor="middle" dominant-baseline="central">Metadata DB</text>
    <text class="ts" x="80" y="38" text-anchor="middle" dominant-baseline="central">SQLite (articles, clusters)</text>
  </g>

  <!-- ===== PERSONALIZATION LAYER ===== -->
  <line x1="200" y1="468" x2="200" y2="490" class="arr"></line>
  <line x1="510" y1="468" x2="510" y2="490" class="arr"></line>
  <line x1="200" y1="490" x2="510" y2="490" class="arr"></line>
  <line x1="355" y1="490" x2="355" y2="500" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(230, 500)">
    <rect class="node-box-coral" x="0" y="0" width="250" height="52" rx="8"></rect>
    <text class="th" x="125" y="20" text-anchor="middle" dominant-baseline="central">User Profile Store</text>
    <text class="ts" x="125" y="38" text-anchor="middle" dominant-baseline="central">Cluster weight vector per user</text>
  </g>
  <line x1="355" y1="552" x2="355" y2="568" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(230, 568)">
    <rect class="node-box-coral" x="0" y="0" width="250" height="52" rx="8"></rect>
    <text class="th" x="125" y="20" text-anchor="middle" dominant-baseline="central">Weight Update Engine</text>
    <text class="ts" x="125" y="38" text-anchor="middle" dominant-baseline="central">Thumbs Up/Down, Dwell Time</text>
  </g>

  <!-- ===== RETRIEVAL LAYER ===== -->
  <line x1="355" y1="620" x2="355" y2="640" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(230, 640)">
    <rect class="node-box-green" x="0" y="0" width="250" height="52" rx="8"></rect>
    <text class="th" x="125" y="20" text-anchor="middle" dominant-baseline="central">Personalized RAG Query</text>
    <text class="ts" x="125" y="38" text-anchor="middle" dominant-baseline="central">Weight-biased vector search</text>
  </g>
  <line x1="355" y1="692" x2="355" y2="708" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(230, 708)">
    <rect class="node-box-green" x="0" y="0" width="250" height="52" rx="8"></rect>
    <text class="th" x="125" y="20" text-anchor="middle" dominant-baseline="central">LLM Response Generation</text>
    <text class="ts" x="125" y="38" text-anchor="middle" dominant-baseline="central">Ollama (Phi-3 Mini) Synthesis</text>
  </g>
  <line x1="355" y1="760" x2="355" y2="776" class="arr" marker-end="url(#arrow)"></line>

  <g transform="translate(230, 776)">
    <rect class="node-box" x="0" y="0" width="250" height="52" rx="8"></rect>
    <text class="th" x="125" y="20" text-anchor="middle" dominant-baseline="central">User Feed + UI Dashboard</text>
    <text class="ts" x="125" y="38" text-anchor="middle" dominant-baseline="central">FastAPI + HTML5/CSS3 Dashboard</text>
  </g>

  <!-- Feedback Loop -->
  <path d="M480 802 Q600 802 600 586 Q600 540 480 540" class="arr-dashed" marker-end="url(#arrow)"></path>
  <text class="ts" x="608" y="670" font-weight="600" fill="#f43f5e">Feedback</text>
  <text class="ts" x="608" y="684" font-weight="600" fill="#f43f5e">Loop</text>

  <!-- Scheduler -->
  <g transform="translate(42, 590)">
    <rect class="node-box-amber" x="0" y="0" width="140" height="52" rx="8"></rect>
    <text class="th" x="70" y="20" text-anchor="middle" dominant-baseline="central">Scheduler</text>
    <text class="ts" x="70" y="38" text-anchor="middle" dominant-baseline="central">APScheduler (Dual Loop)</text>
  </g>
  <path d="M112 590 Q112 30 130 74" class="arr-dashed" marker-end="url(#arrow)"></path>
  <text class="ts" x="48" y="306" font-weight="600" fill="#d97706">Fast/Slow</text>
  <text class="ts" x="48" y="322" font-weight="600" fill="#d97706">Pipeline Loop</text>
</svg>
